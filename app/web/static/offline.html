<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Sin conexión · DGT Panel</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           margin: 0; min-height: 100vh; display: flex; align-items: center;
           justify-content: center; background: #f8fafc; color: #1f2937; text-align: center; }
    main { padding: 1.5rem; max-width: 420px; }
    img { width: 96px; height: 96px; }
    h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; }
    p { color: #6b7280; line-height: 1.5; }
    button { margin-top: 1.2rem; background: #2563eb; color: #fff; border: 0;
             border-radius: 6px; padding: .6rem 1.1rem; font-size: .95rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <img src="/static/icons/icon-192.png" alt="DGT Panel">
    <h1>Sin conexión</h1>
    <p>No se puede conectar con el panel ahora mismo. Comprueba tu conexión a internet e inténtalo de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
